<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hangout Room</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1410; font-family: Georgia, serif; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: fixed; left: 0; right: 0; top: 12px; text-align: center; pointer-events: none; color: #f3e6cf; text-shadow: 0 2px 6px #000; }
  #ui h1 { margin: 0; font-size: 22px; font-weight: normal; letter-spacing: 1px; }
  #hint { font-size: 14px; opacity: 0.85; margin-top: 4px; }
  #stand { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 22px; font-size: 16px; font-family: inherit; border: none; border-radius: 20px; background: #e9c98f; color: #2a1c10; cursor: pointer; display: none; box-shadow: 0 3px 10px rgba(0,0,0,0.5); }
  .panel { position: fixed; background: rgba(30,20,12,0.85); color: #f3e6cf; padding: 12px 14px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.5); }
  #game { left: 16px; bottom: 16px; max-width: 290px; }
  #status { font-size: 16px; margin-bottom: 4px; }
  #players { font-size: 13px; opacity: 0.8; margin-bottom: 8px; }
  #switchRow { margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(243,230,207,0.2); }
  .panel button.sw { background: rgba(233,201,143,0.25); color: #f3e6cf; }
  .panel button.sw.on { background: #e9c98f; color: #2a1c10; }
  #tStatus, #sStatus { font-size: 16px; margin-bottom: 4px; }
  #sPlayers { font-size: 13px; margin-bottom: 8px; }
  #sInfo { font-size: 14px; color: #ffd88a; margin-bottom: 8px; }
  #tTimer { font-size: 13px; color: #ffb36b; margin-bottom: 4px; }
  #tPlayers { font-size: 13px; margin-bottom: 4px; }
  #tInfo { font-size: 12px; opacity: 0.7; font-style: italic; margin-bottom: 8px; }
  #tNote { font-size: 12px; color: #ffd88a; margin-bottom: 4px; white-space: pre-line; }
  .tLabel { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
  #tJobBtns button, #tLength button { font-size: 13px; padding: 4px 8px; margin: 0 4px 4px 0; }
  #tMenu { margin-top: 2px; }
  #bottomRow { margin-top: 2px; padding-top: 6px; border-top: 1px solid rgba(243,230,207,0.2); }
  #msgs .sys { font-style: italic; opacity: 0.75; font-size: 13px; }
  .panel button { font-family: inherit; font-size: 14px; padding: 6px 12px; margin: 0 6px 6px 0; border: none; border-radius: 14px; background: #e9c98f; color: #2a1c10; cursor: pointer; }
  .panel button:disabled { opacity: 0.5; cursor: default; }
  #who { right: 16px; top: 16px; min-width: 160px; max-width: 240px; font-size: 14px; }
  #who h2 { margin: 0 0 6px; font-size: 15px; font-weight: normal; opacity: 0.8; }
  #conn { font-size: 12px; opacity: 0.7; margin-top: 6px; }
  #chat { right: 16px; bottom: 16px; width: 280px; }
  #msgs { height: 150px; overflow-y: auto; font-size: 14px; margin-bottom: 8px; word-wrap: break-word; }
  #msgs b { color: #e9c98f; }
  #chatRow { display: flex; gap: 6px; }
  input { font-family: inherit; font-size: 14px; padding: 6px 10px; border: none; border-radius: 10px; background: #f3e6cf; color: #2a1c10; }
  #chatInput { flex: 1; min-width: 0; }
  #chatRow button { margin: 0; }
  #nameBox { position: fixed; inset: 0; background: rgba(10,6,3,0.6); display: flex; align-items: center; justify-content: center; }
  #nameBox .panel { position: static; text-align: center; padding: 20px 24px; }
  #nameBox h2 { margin: 0 0 12px; font-weight: normal; }
  #nameBox button { margin: 0 0 0 6px; }
  #phoneBar { display: none; }

  /* ---------- Phones and narrow screens ---------- */
  @media (max-width: 700px) {
    #ui { top: 8px; text-align: left; left: 12px; }
    #ui h1 { font-size: 18px; }
    #hint { display: none; }
    #phoneBar { display: flex; gap: 6px; position: fixed; top: 8px; right: 8px; }
    #phoneBar button { position: relative; font-family: inherit; font-size: 14px; padding: 6px 10px; border: none; border-radius: 14px; background: rgba(30,20,12,0.85); color: #f3e6cf; box-shadow: 0 3px 10px rgba(0,0,0,0.5); }
    #newDot { display: none; position: absolute; top: 2px; right: 2px; width: 9px; height: 9px; border-radius: 50%; background: #ff3b2f; }
    #who, #chat { display: none; left: 8px; right: 8px; top: 48px; bottom: auto; width: auto; max-width: none; }
    body.whoOpen #who { display: block; }
    body.chatOpen #chat { display: block; }
    #msgs { height: 110px; }
    #game { left: 8px; right: 8px; bottom: 8px; max-width: none; padding: 8px 10px; }
    #status, #tStatus, #sStatus { font-size: 14px; }
    #players, #tPlayers, #sPlayers { font-size: 12px; margin-bottom: 6px; }
    #switchRow { margin-bottom: 4px; padding-bottom: 4px; }
    .panel button { font-size: 13px; padding: 5px 10px; margin: 0 4px 4px 0; }
    #stand { top: 48px; bottom: auto; font-size: 14px; padding: 6px 16px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Hangout Room</h1>
  <div id="hint">Drag to look around &middot; scroll to zoom &middot; click a chair to sit</div>
</div>
<button id="stand">Stand up</button>
<div id="game" class="panel">
  <div id="switchRow"><button id="swOthello" class="sw on">Othello</button><button id="swTrail" class="sw">LittleTrail</button><button id="swStack" class="sw">LittleStack</button></div>
  <div id="othelloUI">
    <div id="status">Connecting…</div>
    <div id="players">Black: open &middot; White: open</div>
    <button id="join" style="display:none">Join game</button><button id="newGame">New game</button><button id="hints">Hints: On</button>
  </div>
  <div id="trailUI" style="display:none">
    <div id="tStatus">Connecting…</div>
    <div id="tTimer" style="display:none"></div>
    <div id="tPlayers"></div>
    <div id="tNote"></div>
    <div id="tInfo">Point at a trail stone to see what it is</div>
    <div id="tJobs" style="display:none"><div class="tLabel">Pick your job to join:</div><div id="tJobBtns"></div></div>
    <div id="tLength" style="display:none"><div class="tLabel">Game length (until sunset):</div></div>
    <button id="tRoll" style="display:none">🎲 Roll</button><button id="tBuy" style="display:none">Buy</button><button id="tPass" style="display:none">Pass</button><button id="tStart" style="display:none">Start</button><button id="tMore" style="display:none" title="More">⋯</button>
    <div id="tMenu" style="display:none"><button id="tLeave">Leave game</button><button id="tEnd">End game</button></div>
  </div>
  <div id="stackUI" style="display:none">
    <div id="sStatus">Connecting…</div>
    <div id="sPlayers"></div>
    <div id="sInfo" style="display:none"></div>
    <button id="sJoin" style="display:none">Join game</button><button id="sStart" style="display:none">Start</button><button id="sPull" style="display:none">✋ Pull it</button><button id="sTry" style="display:none">Try another</button><button id="sRebuild" style="display:none">🔨 Rebuild</button><button id="sMore" style="display:none" title="More">⋯</button>
    <div id="sMenu" style="display:none"><button id="sLeave">Leave game</button><button id="sEnd">End game</button><button id="sReset">Reset losses</button></div>
  </div>
  <div id="bottomRow"><button id="boardView">Board view</button><button id="mute" title="Sound">🔊</button></div>
</div>
<div id="who" class="panel">
  <h2>In the room</h2>
  <div id="whoList"></div>
  <div id="conn">Connecting…</div>
</div>
<div id="chat" class="panel">
  <div id="msgs"></div>
  <div id="chatRow"><input id="chatInput" maxlength="200" placeholder="Say something…"><button id="send">Send</button></div>
</div>
<div id="phoneBar">
  <button id="chatBtn">💬 Chat<span id="newDot"></span></button><button id="whoBtn">👥 0</button>
</div>
<div id="nameBox">
  <div class="panel">
    <h2>Welcome! What's your name?</h2>
    <input id="nameInput" maxlength="20" placeholder="Your name"><button id="enter">Enter</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<!-- The room's code lives in room.js, which loads core.js, othello.js, trail.js, stack.js and sounds.js -->
<script type="module" src="room.js"></script>
</body>
</html>
