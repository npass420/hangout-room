<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
			<meta name="viewport" content="width=device-width,initial-scale=1">
				<title>Doodle Gallery</title>
				<style>
					html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0908; font-family: Georgia, serif; }
					#c { display: block; width: 100%; height: 100%; touch-action: none; }
					#ui { position: fixed; left: 0; right: 0; top: 12px; text-align: center; pointer-events: none; color: #f3e6cf; text-shadow: 0 2px 6px #000; }
					#ui h1 { margin: 0; font-size: 22px; font-weight: normal; letter-spacing: 1px; color: #ffe9a0; }
					#hint { font-size: 14px; opacity: 0.85; margin-top: 4px; }
					.panel { position: fixed; background: rgba(20,16,12,0.86); color: #f3e6cf; padding: 12px 14px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(201,162,39,0.35); }
					.panel button { font-family: inherit; font-size: 14px; padding: 6px 12px; margin: 0 6px 6px 0; border: none; border-radius: 14px; background: #e9c98f; color: #2a1c10; cursor: pointer; }
					.panel button:disabled { opacity: 0.5; cursor: default; }
					.panel button.sw { background: rgba(233,201,143,0.25); color: #f3e6cf; }
					.panel button.sw.on { background: #e9c98f; color: #2a1c10; }
					#banner { position: fixed; top: 70px; left: 50%; transform: translate(-50%, -12px) scale(0.85); max-width: 90vw; padding: 10px 24px; font-size: 22px; text-align: center; background: rgba(20,16,12,0.92); color: #ffe9a0; border-radius: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; }
					#banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
					#who { right: 16px; top: 16px; min-width: 160px; max-width: 240px; font-size: 14px; }
					#who h2 { margin: 0 0 6px; font-size: 15px; font-weight: normal; opacity: 0.8; }
					#conn { font-size: 12px; opacity: 0.7; margin-top: 6px; }
					#whoBtns { margin-top: 8px; }
					#whoBtns button { font-size: 13px; padding: 4px 10px; margin: 0 6px 0 0; }
					#chat { right: 16px; bottom: 16px; width: 280px; }
					#msgs { height: 150px; overflow-y: auto; font-size: 14px; margin-bottom: 8px; word-wrap: break-word; }
					#msgs b { color: #e9c98f; }
					#chatRow { display: flex; gap: 6px; }
					input { font-family: inherit; font-size: 14px; padding: 6px 10px; border: none; border-radius: 10px; background: #f3e6cf; color: #2a1c10; }
					#chatInput { flex: 1; min-width: 0; }
					#chatRow button { margin: 0; }
					/* start.js: a black cover while the room loads, then the name box over the gallery */
					#cover { position: fixed; inset: 0; z-index: 20; background: #000; transition: opacity 1.3s ease-out; }
					#cover.gone { opacity: 0; pointer-events: none; }
					#nameBox { position: fixed; left: 0; right: 0; bottom: 8%; z-index: 30; display: flex; justify-content: center; pointer-events: none;
					opacity: 0; visibility: hidden; transition: opacity 0.6s, visibility 0.6s; }
					#nameBox.show { opacity: 1; visibility: visible; }
					#nameBox .panel { position: static; pointer-events: auto; text-align: center; padding: 16px 22px; background: rgba(20,16,12,0.78); backdrop-filter: blur(4px);
					box-shadow: 0 4px 18px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(201,162,39,0.55); }
					#nameBox h2 { margin: 0 0 10px; font-weight: normal; font-size: 19px; color: #ffe9a0; }
					#nameBox input { text-align: center; font-size: 16px; }
					#nameBox #enter { display: none; }
					#nameRow { display: flex; gap: 6px; justify-content: center; }
					#nameRow button { margin: 0; font-size: 16px; padding: 6px 14px; border-radius: 10px; }
					/* The little snowflake that turns on the black cover while a room loads (it fades in only if loading takes a moment) */
					#loadFlake { position: fixed; left: 50%; top: 50%; z-index: 25; margin: -24px 0 0 -24px; width: 48px; height: 48px; line-height: 48px; text-align: center;
					font-size: 38px; color: #dff3ff; text-shadow: 0 0 12px rgba(150,215,255,0.9); opacity: 0; pointer-events: none; transition: opacity 0.4s; }
					#loadFlake.on { opacity: 0.85; transition-delay: 0.35s; animation: flakeTurn 3s linear infinite, flakePulse 1.6s ease-in-out infinite; }
					#loadFlake.oops { opacity: 1; animation: none; width: 320px; margin-left: -160px; font-size: 16px; text-shadow: none; pointer-events: auto; cursor: pointer; }
					@keyframes flakeTurn { to { rotate: 360deg; } }
					@keyframes flakePulse { 50% { scale: 1.18; } }
					#nameBox.nudge .panel { animation: nudge 0.4s; }
					@keyframes nudge { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
					#phoneBar { display: none; }

					/* ---------- Phones and narrow screens ---------- */
					@media (max-width: 700px) {
					#ui { top: 8px; text-align: left; left: 12px; }
					#ui h1 { font-size: 18px; }
					#hint { display: none; }
					#phoneBar { display: flex; gap: 6px; position: fixed; top: 8px; right: 8px; }
					#phoneBar button { position: relative; font-family: inherit; font-size: 14px; padding: 6px 10px; border: none; border-radius: 14px; background: rgba(20,16,12,0.85); color: #f3e6cf; box-shadow: 0 3px 10px rgba(0,0,0,0.5); }
					#newDot { display: none; position: absolute; top: 2px; right: 2px; width: 9px; height: 9px; border-radius: 50%; background: #ff3b2f; }
					#who, #chat { display: none; left: 8px; right: 8px; top: 48px; bottom: auto; width: auto; max-width: none; }
					body.whoOpen #who { display: block; }
					body.chatOpen #chat { display: block; }
					#msgs { height: 110px; }
					.panel button { font-size: 13px; padding: 5px 10px; margin: 0 4px 4px 0; }
					#banner { top: 92px; font-size: 17px; padding: 8px 16px; }
					}
				</style>
			</head>
	<body>
		<canvas id="c"></canvas>
		<div id="ui">
			<h1>Doodle Gallery</h1>
			<div id="hint"></div>
		</div>
		<div id="banner"></div>
		<div id="who" class="panel">
			<h2>In the gallery</h2>
			<div id="whoList"></div>
			<div id="conn">Connecting…</div>
			<div id="whoBtns">
				<button id="mute" title="Sound">🔊</button>
			</div>
		</div>
		<div id="chat" class="panel">
			<div id="msgs"></div>
			<div id="chatRow">
				<input id="chatInput" maxlength="200" placeholder="Say something…">
					<button id="send">Send</button>
				</div>
		</div>
		<div id="phoneBar">
			<button id="chatBtn">
				💬 Chat<span id="newDot"></span>
			</button>
			<button id="whoBtn">👥 0</button>
		</div>
		<div id="cover"></div>
		<div id="nameBox">
			<div class="panel">
				<h2 id="nameTitle">Welcome! What's your name?</h2>
				<div id="nameRow">
					<input id="nameInput" maxlength="20" placeholder="Your name">
						<button id="nameOk" title="Come in">✓</button>
					</div>
				<button id="enter">Enter</button>
			</div>
		</div>
		<div id="loadFlake">❄</div>

		<script type="importmap">
			{ "imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			} }
		</script>
		<!-- start.js is the front door: it opens straight into the Doodle Gallery (studio/studio.js), with the name box over it -->
		<script type="module" src="start.js?v=2"></script>
	</body>
</html>
